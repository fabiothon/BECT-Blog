name: 'Test,Build and Deploy to Google Cloud Run'

on:
  push:
    branches:
      - '**'

jobs:
  lint-and-test:
    runs-on: 'ubuntu-24.04'

    permissions:
      contents: 'read'

    services:
      postgres:
        image: 'postgres:17'
        env:
          POSTGRES_USER: '${{ secrets.TEST_DB_USER }}'
          POSTGRES_PASSWORD: '${{ secrets.TEST_DB_PASSWORD }}'
          POSTGRES_DB: '${{ secrets.TEST_DB_NAME }}'
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # actions/checkout@v7.0.1

      - name: 'Set up Python'
        uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' # actions/setup-python@v7.0.0
        with:
          python-version: '3.14.4'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 'Install dependencies'
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 'Lint'
        run: ruff check .

      - name: 'Check formatting'
        run: ruff format --check .

      - name: 'Run tests'
        run: python -m pytest

  deploy:
    needs: 'lint-and-test'
    if: github.ref == 'refs/heads/main'
    runs-on: 'ubuntu-24.04'

    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      REGISTRY: '${{ secrets.GCP_REGISTRY_REGION }}-docker.pkg.dev'
      IMAGE: '${{ secrets.GCP_REGISTRY_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPO }}/${{ secrets.GCP_IMAGE_NAME }}:${{ github.sha }}'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # actions/checkout@v7.0.1

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ secrets.GCP_WIF_PROVIDER }}'
          service_account: '${{ secrets.GCP_DEPLOY_SA }}'
          token_format: 'access_token'

      - name: 'Docker Auth'
        uses: 'docker/login-action@dbcb813823bdd20940b903addbd779551569679f' # docker/login-action@v4.6.0
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.REGISTRY }}'

      - name: 'Build and Push Container'
        run: |-
          if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "Image for ${GITHUB_SHA} already exists, skipping build and push"
          else
            docker build --tag "${IMAGE}" .
            docker push "${IMAGE}"
          fi

      - id: 'deploy'
        name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d' # google-github-actions/deploy-cloudrun@v3
        with:
          service: '${{ secrets.GCP_RUN_SERVICE }}'
          region: '${{ secrets.GCP_RUN_REGION }}'
          project_id: '${{ secrets.GCP_PROJECT_ID }}'
          image: '${{ env.IMAGE }}'

      - name: 'Show output'
        run: |-
          echo "${{ steps.deploy.outputs.url }}"
