<article class="py-8 first:pt-0">
    <div class="flex items-center gap-3 text-sm">
        <img class="size-8 rounded-full object-cover ring-1 ring-line"
             src="{{ post.author.image_path }}"
             alt="{{ post.author.username }}'s profile picture"
             width="32"
             height="32"
             loading="lazy">
        <a class="font-medium hover:underline hover:underline-offset-4"
           href="{{ url_for('user_posts', user_id=post.author.id) }}">{{ post.author.username }}</a>
        <span class="text-muted" aria-hidden="true">·</span>
        <time class="text-muted">{{ post.date_posted.strftime("%B %d, %Y") }}</time>
    </div>
    <h2 class="mt-3 text-xl font-semibold tracking-tight text-balance">
        <a class="transition-colors hover:text-muted"
           href="{{ url_for('post_page', post_id=post.id) }}">{{ post.title }}</a>
    </h2>
    <p class="mt-2 leading-relaxed whitespace-pre-line text-muted">{{ post.content }}</p>
</article>
