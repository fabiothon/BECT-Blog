{% extends "layout.html" %}
{% block content %}
    <h1 class="mb-10 text-3xl font-semibold tracking-tight">Posts by {{ user.username }}</h1>
    <div id="postsContainer" class="divide-y divide-line/70">
        {% for post in posts %}
            {% include "partials/post_item.html" %}
        {% else %}
            <p class="text-muted">No posts by this user yet.</p>
        {% endfor %}
    </div>
    {% if has_more %}
        <div class="mt-8 flex justify-center">
            <button type="button" class="btn btn-secondary" id="loadMoreBtn">Load More Posts</button>
        </div>
    {% endif %}
{% endblock content %}
{% block scripts %}
    <script type="module">
  import { escapeHtml, formatDate } from '/static/js/utils.js';

  const userId = {{ user.id }};
  let currentOffset = {{ limit }};
  const limit = {{ limit }};
  let hasMore = {{ 'true' if has_more else 'false' }};

  const postsContainer = document.getElementById('postsContainer');
  const loadMoreBtn = document.getElementById('loadMoreBtn');

  function createPostHTML(post) {
    return `
      <article class="py-8 first:pt-0">
        <div class="flex items-center gap-3 text-sm">
          <img class="size-8 rounded-full object-cover ring-1 ring-line" src="${escapeHtml(post.author.image_path)}" alt="${escapeHtml(post.author.username)}'s profile picture" width="32" height="32" loading="lazy">
          <a class="font-medium hover:underline hover:underline-offset-4" href="/users/${post.author.id}/posts">${escapeHtml(post.author.username)}</a>
          <span class="text-muted" aria-hidden="true">·</span>
          <time class="text-muted">${formatDate(post.date_posted)}</time>
        </div>
        <h2 class="mt-3 text-xl font-semibold tracking-tight text-balance">
          <a class="transition-colors hover:text-muted" href="/posts/${post.id}">${escapeHtml(post.title)}</a>
        </h2>
        <p class="mt-2 leading-relaxed whitespace-pre-line text-muted">${escapeHtml(post.content)}</p>
      </article>
    `;
  }

  async function loadMorePosts() {
    loadMoreBtn.disabled = true;
    loadMoreBtn.textContent = 'Loading...';

    let errorOccurred = false;

    try {
      const response = await fetch(`/api/users/${userId}/posts?skip=${currentOffset}&limit=${limit}`);

      if (!response.ok) {
        throw new Error('Failed to fetch posts');
      }

      const data = await response.json();

      for (const post of data.posts) {
        postsContainer.insertAdjacentHTML('beforeend', createPostHTML(post));
      }

      currentOffset += data.posts.length;
      hasMore = data.has_more;

      if (!hasMore) {
        loadMoreBtn.hidden = true;
      }
    } catch (error) {
      errorOccurred = true;
      console.error('Error loading posts:', error);
      loadMoreBtn.textContent = 'Error - Click to Retry';
      loadMoreBtn.disabled = false;
    } finally {
      if (!errorOccurred && hasMore) {
        loadMoreBtn.disabled = false;
        loadMoreBtn.textContent = 'Load More Posts';
      }
    }
  }

  if (loadMoreBtn) {
    loadMoreBtn.addEventListener('click', loadMorePosts);
  }
    </script>
{% endblock scripts %}
