{% extends "layout.html" %}
{% block content %}
    <div class="mx-auto max-w-sm py-6">
        <h1 class="text-3xl font-semibold tracking-tight">Register</h1>
        <p class="mt-2 text-muted">Create an account to start posting.</p>
        <form id="registerForm" class="mt-8 space-y-4">
            <div>
                <label for="username" class="label">Username</label>
                <input type="text"
                       class="field"
                       id="username"
                       name="username"
                       required
                       minlength="1"
                       maxlength="50">
            </div>
            <div>
                <label for="email" class="label">Email</label>
                <input type="email" class="field" id="email" name="email" required>
            </div>
            <div>
                <label for="password" class="label">Password</label>
                <input type="password"
                       class="field"
                       id="password"
                       name="password"
                       required
                       minlength="8">
                <p class="hint">Must be at least 8 characters.</p>
            </div>
            <div>
                <label for="confirmPassword" class="label">Confirm Password</label>
                <input type="password"
                       class="field"
                       id="confirmPassword"
                       name="confirmPassword"
                       required
                       minlength="8">
                <p id="passwordError" class="mt-1.5 text-sm text-danger" hidden>Passwords do not match.</p>
            </div>
            <button type="submit" class="btn btn-primary w-full">Register</button>
        </form>
        <p class="mt-6 text-sm text-muted">
            Already have an account? <a class="link" href="{{ url_for('login_page') }}">Login here</a>
        </p>
    </div>
{% endblock content %}
{% block scripts %}
    <script type="module">
      import { getErrorMessage, showModal } from '/static/js/utils.js';

      const registerForm = document.getElementById('registerForm');
      const passwordInput = document.getElementById('password');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const passwordError = document.getElementById('passwordError');

      // Check passwords match on input
      confirmPasswordInput.addEventListener('input', () => {
        if (passwordInput.value !== confirmPasswordInput.value) {
          passwordError.hidden = false;
          confirmPasswordInput.setCustomValidity('Passwords do not match');
        } else {
          passwordError.hidden = true;
          confirmPasswordInput.setCustomValidity('');
        }
      });

      registerForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        // Check passwords match
        if (passwordInput.value !== confirmPasswordInput.value) {
          passwordError.hidden = false;
          return;
        }

        const formData = new FormData(registerForm);
        const userData = {
          username: formData.get('username'),
          email: formData.get('email'),
          password: formData.get('password'),
        };

        try {
          const response = await fetch('/api/users', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(userData),
          });

          if (response.ok) {
            // Show success modal and redirect to login
            document.getElementById('successMessage').textContent =
              'Account created successfully! Please login.';
            showModal('successModal');

            document.getElementById('successModal').addEventListener('close', () => {
              window.location.href = '/login';
            }, { once: true });
          } else {
            const error = await response.json();
            document.getElementById('errorMessage').textContent = getErrorMessage(error);
            showModal('errorModal');
          }
        } catch (error) {
          document.getElementById('errorMessage').textContent =
            'Network error. Please check your connection and try again.';
          showModal('errorModal');
        }
      });
    </script>
{% endblock scripts %}
